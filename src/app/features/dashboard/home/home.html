<main class="p-4 sm:p-6 lg:p-8">
  <!-- Header / Bienvenida -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Dashboard</h1>
    <p class="mt-2 text-gray-600 dark:text-gray-400">
      Bienvenido al sistema de gestión del restaurante
    </p>
  </div>

  <!-- Grid de Tarjetas de Estadísticas -->
  <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-4 mb-8">
    <!-- Tarjeta 1: Usuarios -->
    <div
      class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-l-4 border-blue-500 hover:shadow-lg transition-shadow duration-300"
    >
      <div class="flex items-center justify-between">
        <div>
          <p class="text-gray-600 dark:text-gray-400 text-sm font-medium">
            Total Usuarios
          </p>
          <p class="text-2xl font-bold text-gray-900 dark:text-white mt-2">0</p>
        </div>
        <svg
          class="w-12 h-12 text-blue-500 opacity-20"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"
          />
        </svg>
      </div>
    </div>

    <!-- Tarjeta 2: Productos -->
    <div
      class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-l-4 border-green-500 hover:shadow-lg transition-shadow duration-300"
    >
      <div class="flex items-center justify-between">
        <div>
          <p class="text-gray-600 dark:text-gray-400 text-sm font-medium">
            Productos
          </p>
          <p class="text-2xl font-bold text-gray-900 dark:text-white mt-2">0</p>
        </div>
        <svg
          class="w-12 h-12 text-green-500 opacity-20"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042L5.960 9H9a1 1 0 000 2H5.959l-.194.988A1 1 0 005 13H4a1 1 0 000 2h1a3 3 0 106 0h1a1 1 0 000-2h-1l-.194-.988A1 1 0 0010 9H6.041L5.022 4.868a.997.997 0 00-.01-.042L4.78 3H15a1 1 0 000-2H3z"
          />
        </svg>
      </div>
    </div>

    <!-- Tarjeta 3: Mesas -->
    <div
      class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-l-4 border-purple-500 hover:shadow-lg transition-shadow duration-300"
    >
      <div class="flex items-center justify-between">
        <div>
          <p class="text-gray-600 dark:text-gray-400 text-sm font-medium">
            Mesas
          </p>
          <p class="text-2xl font-bold text-gray-900 dark:text-white mt-2">0</p>
        </div>
        <svg
          class="w-12 h-12 text-purple-500 opacity-20"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm0 6a1 1 0 011-1h12a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zm0 8a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2z"
          />
        </svg>
      </div>
    </div>

    <!-- Tarjeta 4: Ventas -->
    <div
      class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-l-4 border-orange-500 hover:shadow-lg transition-shadow duration-300"
    >
      <div class="flex items-center justify-between">
        <div>
          <p class="text-gray-600 dark:text-gray-400 text-sm font-medium">
            Ventas del Día
          </p>
          <p class="text-2xl font-bold text-gray-900 dark:text-white mt-2">
            $0.00
          </p>
        </div>
        <svg
          class="w-12 h-12 text-orange-500 opacity-20"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            d="M8.16 5.314l4.897-1.596A1 1 0 0115 4.97v4.396l.573 1.148a1 1 0 01-.57 1.428c-.41.12-.783.318-1.09.564L11 9.854v5.5a1 1 0 01-1 1H8a1 1 0 01-1-1v-5.5L2.997 12.506c-.307-.246-.68-.445-1.09-.564a1 1 0 01-.57-1.428L2 9.366V4.97a1 1 0 011.043-.252l4.897 1.596z"
          />
        </svg>
      </div>
    </div>
  </div>

  <!-- Sección de Información -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Card: Información del Sistema -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
      <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">
        Información del Sistema
      </h2>
      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-gray-600 dark:text-gray-400">Estado:</span>
          <span
            class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200"
          >
            Activo
          </span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-600 dark:text-gray-400">Versión:</span>
          <span class="text-gray-900 dark:text-white font-medium">1.0.0</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-600 dark:text-gray-400"
            >Última actualización:</span
          >
          <span class="text-gray-900 dark:text-white font-medium">Hoy</span>
        </div>
      </div>
    </div>

    <!-- Card: Acciones Rápidas -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
      <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">
        Acciones Rápidas
      </h2>
      <div class="space-y-2">
        <button
          class="w-full px-4 py-2 text-left text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-gray-700 rounded-md transition-colors duration-200 font-medium"
        >
          → Ver todos los usuarios
        </button>
        <button
          class="w-full px-4 py-2 text-left text-green-600 dark:text-green-400 hover:bg-green-50 dark:hover:bg-gray-700 rounded-md transition-colors duration-200 font-medium"
        >
          → Gestionar productos
        </button>
        <button
          class="w-full px-4 py-2 text-left text-purple-600 dark:text-purple-400 hover:bg-purple-50 dark:hover:bg-gray-700 rounded-md transition-colors duration-200 font-medium"
        >
          → Ver mesas disponibles
        </button>
        <button
          class="w-full px-4 py-2 text-left text-orange-600 dark:text-orange-400 hover:bg-orange-50 dark:hover:bg-gray-700 rounded-md transition-colors duration-200 font-medium"
        >
          → Ver reportes de ventas
        </button>
      </div>
    </div>
  </div>
</main>
